name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        working-directory: parable-starter
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Record canonical Engine listening evidence
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD > build/patch-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/patch-auditions/HEAD_COMMIT
          c++ --version > build/patch-auditions/HOST_COMPILER.txt
          sha256sum include/parable_core.h include/parable_patch.h src/parable_patch.cpp src/patch_json.cpp src/parable_prepare.cpp include/parable_rat.h src/parable_rat.cpp src/rat_circuit_math.h tools/patch_audition.cpp tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tests/fixtures/patch-v1/rat* > build/patch-auditions/SOURCE_SHA256SUMS
          cp third_party/labrat/*LICENSE.txt third_party/labrat/provenance.json build/patch-auditions/
          (cd build/patch-auditions && sha256sum ./*.wav ./*.patch.json) > build/patch-auditions/SHA256SUMS
      - name: Publish canonical Engine listening evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-patch-rat-auditions
          path: parable-starter/build/patch-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render shared-kernel LabRAT auditions and circuit measurements
        if: matrix.build_type == 'Release'
        run: |
          ./build/parable_rat_lab --output build/rat-auditions
          python3 tools/soundforge/check_labrat.py --directory build/rat-auditions > build/rat-auditions/LABRAT_COMPATIBILITY.json
          git rev-parse HEAD > build/rat-auditions/SOURCE_COMMIT
          c++ --version > build/rat-auditions/HOST_COMPILER.txt
          sha256sum src/parable_rat.cpp src/rat_circuit_math.h include/parable_rat.h tools/rat_lab.cpp tools/rat_measure.h tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/validate_registry.py tools/soundforge/check_labrat.py tools/soundforge/registry.json tests/fixtures/soundforge/labrat-main.json tests/fixtures/rat/*.csv > build/rat-auditions/SOURCE_SHA256SUMS
          cp third_party/labrat/*LICENSE.txt third_party/labrat/provenance.json tests/fixtures/rat/spice-manifest.json build/rat-auditions/
          cp tools/soundforge/registry.json build/rat-auditions/soundforge-registry.json
          (cd build/rat-auditions && sha256sum ./*.wav) > build/rat-auditions/SHA256SUMS
      - name: Publish LabRAT listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-labrat-auditions
          path: parable-starter/build/rat-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render shared-kernel CMOS auditions and independent comparisons
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./build/parable_cmos_lab --output build/cmos-auditions
          git rev-parse HEAD > build/cmos-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/cmos-auditions/HEAD_COMMIT
          c++ --version > build/cmos-auditions/HOST_COMPILER.txt
          sha256sum src/parable_cmos.cpp src/cmos_device.h include/parable_cmos.h tools/cmos_lab.cpp tools/cmos_measure.h tools/cmos_spice_reference.py tools/rat_spice_reference.py tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/registry.json third_party/cmos/* tests/fixtures/cmos/* > build/cmos-auditions/SOURCE_SHA256SUMS
          cp third_party/cmos/* tests/fixtures/cmos/spice-manifest.json build/cmos-auditions/
          cp tools/soundforge/registry.json build/cmos-auditions/soundforge-registry.json
          (cd build/cmos-auditions && sha256sum ./*.wav) > build/cmos-auditions/SHA256SUMS
      - name: Publish experimental CMOS listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-cmos-auditions
          path: parable-starter/build/cmos-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render germanium raw-relative and matched auditions
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./build/parable_germanium_lab --output build/germanium-auditions
          git rev-parse HEAD > build/germanium-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/germanium-auditions/HEAD_COMMIT
          c++ --version > build/germanium-auditions/HOST_COMPILER.txt
          sha256sum src/parable_germanium.cpp src/germanium_device.h include/parable_germanium.h tools/germanium_lab.cpp tools/germanium_measure.h tools/germanium_spice_reference.py tools/rat_spice_reference.py tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/registry.json third_party/germanium/* tests/fixtures/germanium/*.csv tests/fixtures/germanium/spice-manifest.json tests/fixtures/germanium/netlists/* > build/germanium-auditions/SOURCE_SHA256SUMS
          cp third_party/germanium/* tests/fixtures/germanium/spice-manifest.json build/germanium-auditions/
          cp -r tests/fixtures/germanium/netlists build/germanium-auditions/
          cp tools/soundforge/registry.json build/germanium-auditions/soundforge-registry.json
          (cd build/germanium-auditions && sha256sum ./*.wav) > build/germanium-auditions/SHA256SUMS
      - name: Publish experimental germanium listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-germanium-auditions
          path: parable-starter/build/germanium-auditions/
          if-no-files-found: error
          retention-days: 7

  integration-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: parable-starter
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -no-pie"
      - name: Build integration and existing affected tests
        run: cmake --build build --target parable_core_test parable_audio_safety_test parable_patch_test parable_prepare_test parable_rat_test parable_rat_integration_test parable_patch_audition -j2
      - name: Test integration and affected boundaries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^(core_validation|audio_safety|patch_contract|host_preparation|rat_patch_integration|patch_audio_evidence|rat_circuit_and_safety)$'
