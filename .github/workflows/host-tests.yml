name: Host tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        build_type: [Debug, Release]
    defaults:
      run:
        working-directory: parable-starter
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error
      - name: Render source-derived TS808 and truly open D2 with NEW guitar take06
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/ts808-input
          curl --fail --show-error --location https://zenodo.org/api/records/14963133/files/P3_music.zip/content --output build/ts808-input/P3_music.zip
          python3 tools/ts808_input.py --archive build/ts808-input/P3_music.zip --output build/ts808-input
          ./build/parable_ts808_lab --input build/ts808-input/take06-26s-mono16.wav --output build/ts808-auditions
          ./build/parable_ts808_lab --input build/ts808-input/take06-26s-mono16.wav --output build/ts808-repeat
          for file in build/ts808-auditions/*; do
            if [ "$(basename "$file")" != renders.csv ]; then cmp "$file" "build/ts808-repeat/$(basename "$file")"; fi
          done
          python3 - <<'PYREF'
          import hashlib,json
          from pathlib import Path
          root=Path('tests/fixtures/ts808')
          manifest=json.loads((root/'spice-manifest.json').read_text())
          for name,digest in manifest['fixture_sha256'].items(): assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest
          for name,digest in manifest['netlist_sha256'].items(): assert hashlib.sha256((root/'netlists'/name).read_bytes()).hexdigest()==digest
          PYREF
          cp build/ts808-measurements/*.csv build/ts808-auditions/
          cp build/Testing/Temporary/LastTest.log build/ts808-auditions/HOST_TESTS.txt
          cp build/ts808-input/source-original-stereo24.wav build/ts808-input/take06-26s-mono16.wav build/ts808-input/source-receipt.json build/ts808-auditions/
          cp third_party/ts808/* docs/SF010_REPORT.md docs/SF010_GATE0.md docs/adr/ADR-010-ts808-open-diode.md build/ts808-auditions/
          cp -r tests/fixtures/ts808 build/ts808-auditions/independent-reference
          git rev-parse HEAD > build/ts808-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/ts808-auditions/HEAD_COMMIT
          c++ --version > build/ts808-auditions/HOST_COMPILER.txt
          sha256sum include/parable_ts808.h src/parable_ts808.cpp src/ts808_device.h tools/ts808_lab.cpp tools/ts808_stimulus.h tools/ts808_input.py tools/ts808_spice_reference.py tools/check_ts808_arm.py tests/test_ts808* tests/fixtures/ts808/*.csv tests/fixtures/ts808/*.json tests/fixtures/ts808/netlists/* tests/activation_guard.* tools/lab_wav.h tools/rat_spice_reference.py tools/soundforge/analysis.h tools/soundforge/excitation.h third_party/ts808/* include/parable_core.h > build/ts808-auditions/SOURCE_SHA256SUMS
          (cd build/ts808-auditions && sha256sum ./*.wav ./*.csv ./*.json ./*.svg) > build/ts808-auditions/SHA256SUMS
      - name: Publish TS808 healthy and open-D2 audio and circuit evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-ts808-auditions
          path: parable-starter/build/ts808-auditions/
          if-no-files-found: error
          retention-days: 30
      - name: Render rotary motor-belt A/B and independent motion proof
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/rotary-input
          curl --fail --show-error --location https://huggingface.co/datasets/Julian-br/GuitarJam/resolve/2d467bfec90af19301b01123494f4b2ba64c5a3a/guitar_jam/test/050.wav --output build/rotary-input/050.wav
          echo '22e7b845fc2d71200c72c13fedbeb5f8ac593e48a01f99875f857e0cc5dfecd0  build/rotary-input/050.wav' | sha256sum -c -
          ./build/parable_rotary_lab --input build/rotary-input/050.wav --output build/rotary-auditions
          ./build/parable_rotary_lab --input build/rotary-input/050.wav --output build/rotary-repeat
          for file in build/rotary-auditions/*.wav; do cmp "$file" "build/rotary-repeat/$(basename "$file")"; done
          python3 tools/rotary_reference.py --output build/rotary-reference
          for file in tests/fixtures/rotary/*; do cmp "$file" "build/rotary-reference/$(basename "$file")"; done
          ./build/parable_rotary_test > build/rotary-auditions/tests-and-layout.txt
          cp build/rotary-input/050.wav build/rotary-auditions/source-original.wav
          cp third_party/rotary/* third_party/tape/GuitarJam-README.md tests/fixtures/rotary/reference-manifest.json docs/SF007_REPORT.md docs/SF007_GATE0.md docs/adr/ADR-007-rotary-belt-model.md build/rotary-auditions/
          git rev-parse HEAD > build/rotary-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/rotary-auditions/HEAD_COMMIT
          c++ --version > build/rotary-auditions/HOST_COMPILER.txt
          sha256sum include/parable_rotary.h src/parable_rotary.cpp src/rotary_delay.h tools/rotary_lab.cpp tools/rotary_reference.py tools/check_rotary_arm.py tests/test_rotary* tests/fixtures/rotary/* tests/activation_guard.* tools/lab_wav.h tools/rat_measure.h tools/soundforge/analysis.h tools/soundforge/excitation.h third_party/rotary/* third_party/tape/GuitarJam-README.md include/parable_core.h > build/rotary-auditions/SOURCE_SHA256SUMS
          (cd build/rotary-auditions && sha256sum ./*.wav ./*.csv ./*.json ./*.svg) > build/rotary-auditions/SHA256SUMS
      - name: Publish healthy and worn-belt rotary listening evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-rotary-auditions
          path: parable-starter/build/rotary-auditions/
          if-no-files-found: error
          retention-days: 30
      - name: Render tape echo and isolate feedback-zero magnetic ghost
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p build/tape-input
          curl --fail --show-error --location https://huggingface.co/datasets/Julian-br/GuitarJam/resolve/2d467bfec90af19301b01123494f4b2ba64c5a3a/guitar_jam/test/050.wav --output build/tape-input/050.wav
          echo '22e7b845fc2d71200c72c13fedbeb5f8ac593e48a01f99875f857e0cc5dfecd0  build/tape-input/050.wav' | sha256sum -c -
          ./build/parable_tape_lab --input build/tape-input/050.wav --output build/tape-auditions
          ./build/parable_tape_lab --input build/tape-input/050.wav --output build/tape-repeat
          for file in build/tape-auditions/*.wav; do cmp "$file" "build/tape-repeat/$(basename "$file")"; done
          python3 tools/tape_reference.py --output build/tape-reference
          cmp tests/fixtures/tape/reference.csv build/tape-reference/reference.csv
          cmp tests/fixtures/tape/reference-manifest.json build/tape-reference/reference-manifest.json
          ./build/parable_tape_test > build/tape-auditions/tests-and-layout.txt
          cp build/tape-input/050.wav build/tape-auditions/source-original.wav
          cp third_party/tape/* tests/fixtures/tape/reference-manifest.json docs/SF006_REPORT.md docs/SF006_GATE0.md docs/adr/ADR-006-reduced-tape-medium.md build/tape-auditions/
          git rev-parse HEAD > build/tape-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/tape-auditions/HEAD_COMMIT
          c++ --version > build/tape-auditions/HOST_COMPILER.txt
          sha256sum include/parable_tape.h src/parable_tape.cpp tools/tape_lab.cpp tools/tape_reference.py tools/check_tape_arm.py tests/test_tape* tests/fixtures/tape/* tests/activation_guard.* tools/lab_wav.h tools/rat_measure.h tools/soundforge/analysis.h tools/soundforge/excitation.h third_party/tape/* include/parable_core.h include/parable_activation.h src/parable_activation*.cpp > build/tape-auditions/SOURCE_SHA256SUMS
          (cd build/tape-auditions && sha256sum ./*.wav ./*.csv ./*.json) > build/tape-auditions/SHA256SUMS
      - name: Publish healthy and defective tape listening evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-tape-auditions
          path: parable-starter/build/tape-auditions/
          if-no-files-found: error
          retention-days: 30
      - name: Record real DSP activation evidence
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p build/activation-evidence
          ./build/parable_activation_test > build/activation-evidence/contract-layout-timing.txt
          ./build/parable_activation_test --stress build/activation-evidence/ownership.csv > build/activation-evidence/stress.txt
          ./build/parable_activation_demo 0 2 1 3 0 > build/activation-evidence/demo.txt
          ./build/parable_activation_demo 0 2 1 3 0 > build/activation-evidence/demo-repeat.txt
          cmp build/activation-evidence/demo.txt build/activation-evidence/demo-repeat.txt
          git rev-parse HEAD > build/activation-evidence/SOURCE_COMMIT
          c++ --version > build/activation-evidence/HOST_COMPILER.txt
          sha256sum include/parable_activation.h src/parable_activation*.cpp tests/test_activation.cpp tests/activation_guard.* tools/activation_demo.cpp > build/activation-evidence/SOURCE_SHA256SUMS
      - name: Repeat and record synthetic living-source evidence
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./build/parable_living_demo --output build/living-repeat-1 --chunk 1
          ./build/parable_living_demo --output build/living-repeat-256 --chunk 256
          diff -rq build/living-evidence build/living-repeat-1
          diff -rq build/living-evidence build/living-repeat-256
          ./build/parable_living_test > build/living-evidence/contract-layout-throughput.txt
          ./build/parable_living_test --stress > build/living-evidence/concurrency.txt
          git rev-parse HEAD > build/living-evidence/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/living-evidence/HEAD_COMMIT
          c++ --version > build/living-evidence/HOST_COMPILER.txt
          sha256sum include/parable_living.h src/parable_living*.cpp tools/living_fixture.h tools/living_demo.cpp tests/test_living.cpp tests/activation_guard.* tests/fixtures/living/* include/parable_core.h include/parable_rat.h src/parable_rat.cpp src/rat_circuit_math.h include/parable_activation.h src/parable_activation*.cpp tools/soundforge/excitation.h tools/soundforge/analysis.h tools/lab_wav.h > build/living-evidence/SOURCE_SHA256SUMS
          cp third_party/labrat/*LICENSE.txt third_party/labrat/provenance.json build/living-evidence/
          (cd build/living-evidence && sha256sum ./*.wav ./*.csv ./*.json) > build/living-evidence/SHA256SUMS
      - name: Publish synthetic living-source listening and timing evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-living-source-evidence
          path: parable-starter/build/living-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Publish activation host evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-activation-evidence
          path: parable-starter/build/activation-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Repeat deterministic preset fault matrix
        if: matrix.build_type == 'Release'
        run: |
          mkdir -p build/preset-evidence
          ./build/parable_presets_test > build/preset-evidence/fault-matrix.txt
          ./build/parable_presets_test > build/preset-evidence/repeat.txt
          cmp build/preset-evidence/fault-matrix.txt build/preset-evidence/repeat.txt
          git rev-parse HEAD > build/preset-evidence/SOURCE_COMMIT
          c++ --version > build/preset-evidence/HOST_COMPILER.txt
          sha256sum include/parable_presets.h include/parable_flash_sim.h src/parable_presets.cpp src/parable_flash_sim.cpp src/preset_crc.h tests/test_presets.cpp tests/fixtures/presets/* > build/preset-evidence/SOURCE_SHA256SUMS
      - name: Publish preset journal host evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-preset-journal-evidence
          path: parable-starter/build/preset-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Record canonical Engine listening evidence
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git rev-parse HEAD > build/patch-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/patch-auditions/HEAD_COMMIT
          c++ --version > build/patch-auditions/HOST_COMPILER.txt
          sha256sum include/parable_core.h include/parable_patch.h src/parable_patch.cpp src/patch_json.cpp src/parable_prepare.cpp include/parable_rat.h src/parable_rat.cpp src/rat_circuit_math.h tools/patch_audition.cpp tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tests/fixtures/patch-v1/rat* > build/patch-auditions/SOURCE_SHA256SUMS
          cp third_party/labrat/*LICENSE.txt third_party/labrat/provenance.json build/patch-auditions/
          (cd build/patch-auditions && sha256sum ./*.wav ./*.patch.json) > build/patch-auditions/SHA256SUMS
      - name: Publish canonical Engine listening evidence
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-patch-rat-auditions
          path: parable-starter/build/patch-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render shared-kernel LabRAT auditions and circuit measurements
        if: matrix.build_type == 'Release'
        run: |
          ./build/parable_rat_lab --output build/rat-auditions
          python3 tools/soundforge/check_labrat.py --directory build/rat-auditions > build/rat-auditions/LABRAT_COMPATIBILITY.json
          git rev-parse HEAD > build/rat-auditions/SOURCE_COMMIT
          c++ --version > build/rat-auditions/HOST_COMPILER.txt
          sha256sum src/parable_rat.cpp src/rat_circuit_math.h include/parable_rat.h tools/rat_lab.cpp tools/rat_measure.h tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/validate_registry.py tools/soundforge/check_labrat.py tools/soundforge/registry.json tests/fixtures/soundforge/labrat-main.json tests/fixtures/rat/*.csv > build/rat-auditions/SOURCE_SHA256SUMS
          cp third_party/labrat/*LICENSE.txt third_party/labrat/provenance.json tests/fixtures/rat/spice-manifest.json build/rat-auditions/
          cp tools/soundforge/registry.json build/rat-auditions/soundforge-registry.json
          (cd build/rat-auditions && sha256sum ./*.wav) > build/rat-auditions/SHA256SUMS
      - name: Publish LabRAT listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-labrat-auditions
          path: parable-starter/build/rat-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render shared-kernel CMOS auditions and independent comparisons
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./build/parable_cmos_lab --output build/cmos-auditions
          git rev-parse HEAD > build/cmos-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/cmos-auditions/HEAD_COMMIT
          c++ --version > build/cmos-auditions/HOST_COMPILER.txt
          sha256sum src/parable_cmos.cpp src/cmos_device.h include/parable_cmos.h tools/cmos_lab.cpp tools/cmos_measure.h tools/cmos_spice_reference.py tools/rat_spice_reference.py tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/registry.json third_party/cmos/* tests/fixtures/cmos/* > build/cmos-auditions/SOURCE_SHA256SUMS
          cp third_party/cmos/* tests/fixtures/cmos/spice-manifest.json build/cmos-auditions/
          cp tools/soundforge/registry.json build/cmos-auditions/soundforge-registry.json
          (cd build/cmos-auditions && sha256sum ./*.wav) > build/cmos-auditions/SHA256SUMS
      - name: Publish experimental CMOS listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-cmos-auditions
          path: parable-starter/build/cmos-auditions/
          if-no-files-found: error
          retention-days: 7
      - name: Render germanium raw-relative and matched auditions
        if: matrix.build_type == 'Release'
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./build/parable_germanium_lab --output build/germanium-auditions
          git rev-parse HEAD > build/germanium-auditions/SOURCE_COMMIT
          printenv HEAD_COMMIT > build/germanium-auditions/HEAD_COMMIT
          c++ --version > build/germanium-auditions/HOST_COMPILER.txt
          sha256sum src/parable_germanium.cpp src/germanium_device.h include/parable_germanium.h tools/germanium_lab.cpp tools/germanium_measure.h tools/germanium_spice_reference.py tools/rat_spice_reference.py tools/lab_wav.h tools/soundforge/analysis.h tools/soundforge/excitation.h tools/soundforge/registry.json third_party/germanium/* tests/fixtures/germanium/*.csv tests/fixtures/germanium/spice-manifest.json tests/fixtures/germanium/netlists/* > build/germanium-auditions/SOURCE_SHA256SUMS
          cp third_party/germanium/* tests/fixtures/germanium/spice-manifest.json build/germanium-auditions/
          cp -r tests/fixtures/germanium/netlists build/germanium-auditions/
          cp tools/soundforge/registry.json build/germanium-auditions/soundforge-registry.json
          (cd build/germanium-auditions && sha256sum ./*.wav) > build/germanium-auditions/SHA256SUMS
      - name: Publish experimental germanium listening material
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parable-germanium-auditions
          path: parable-starter/build/germanium-auditions/
          if-no-files-found: error
          retention-days: 7

  integration-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: parable-starter
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -no-pie"
      - name: Build integration and existing affected tests
        run: cmake --build build --target parable_core_test parable_audio_safety_test parable_patch_test parable_prepare_test parable_rat_test parable_rat_integration_test parable_patch_audition parable_firmware_measurement_test parable_presets_test parable_activation_test parable_activation_demo parable_living_test parable_living_demo parable_tape_test parable_tape_lab parable_rotary_test parable_rotary_lab -j2
      - name: Test integration and affected boundaries
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^(firmware_measurement_math_status|core_validation|audio_safety|patch_contract|host_preparation|rat_patch_integration|patch_audio_evidence|rat_circuit_and_safety|preset_journal|activation_contract|activation_concurrency|activation_demo|living_contract|living_concurrency|living_audio_evidence|tape_medium_and_safety|tape_listening_cli|rotary_mechanics_and_safety|rotary_listening_cli)$'

      - name: Configure focused TS808 ASan and UBSan at O1
        run: cmake -S . -B build/ts808-sanitized -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$PWD/build/_deps/nlohmann_json-src" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -no-pie"
      - name: Build focused TS808 sanitizer targets
        run: cmake --build build/ts808-sanitized --target parable_ts808_test parable_ts808_lab -j2
      - name: Test TS808 circuit and listening boundaries with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ts808-sanitized --output-on-failure --no-tests=error -R '^ts808_'

  activation-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: parable-starter
    steps:
      - uses: actions/checkout@v4
      - name: Configure ThreadSanitizer
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -fno-pie -O1" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -no-pie"
      - name: Build actual activation and DSP tests
        run: cmake --build build --target parable_activation_test parable_living_test -j2
      - name: Test actual activation with ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --no-tests=error -R '^(activation|living)_(contract|concurrency)$'
