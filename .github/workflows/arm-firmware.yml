name: ARM firmware build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  seed3-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned ARM firmware and produce resource evidence
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 parable-starter/firmware/build.py
      - name: Rebuild the fifteen one-BOOT images with libDaisy STM reset path
        run: |
          git fetch --no-tags --depth=1 origin 3d091127f154847c6938ff909ceecc1ca942ac85
          python3 parable-starter/tools/resources/firmware.py \
            --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ \
            --libdaisy parable-starter/build/arm-cache/libDaisy \
            --output parable-starter/build/arm/oneboot-firmware --fetch --usb-control \
            --only rat rat_fir97 rat_fir97_fp32 rat_1x_cost_only cmos germanium muff ts808 klon blender fz1 tape_saturation spring leo_hall chain_scorpio_gemini_rooms_0
          python3 parable-starter/tools/resources/audit_handoff.py \
            --kit parable-starter/build/arm/oneboot-firmware \
            --objdump parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-objdump
          python3 parable-starter/tools/resources/package_runner.py \
            --build parable-starter/build/arm/oneboot-firmware \
            --output parable-starter/build/arm/oneboot-kit
          cp parable-starter/tools/resources/seed3_oneboot_batch.py parable-starter/build/arm/oneboot-kit/
      - name: Build and audit isolated RAM-only identity instrument (never flash)
        run: python3 parable-starter/tools/resources/ram_identity/build.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --libdaisy parable-starter/build/arm-cache/libDaisy --output parable-starter/build/arm/ram-identity
      - name: Build and audit staged RAM-only startup diagnostics (never flash)
        run: python3 parable-starter/tools/resources/ram_startup/build.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --libdaisy parable-starter/build/arm-cache/libDaisy --output parable-starter/build/arm/ram-startup
      - name: Compile and inspect prepared activation (no firmware integration)
        run: python3 parable-starter/tools/check_activation_arm.py --living --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/activation-audit
      - name: Compile and inspect standalone tape medium (not firmware integrated)
        run: python3 parable-starter/tools/check_tape_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/tape-audit
      - name: Compile and inspect standalone rotary (not firmware integrated)
        run: python3 parable-starter/tools/check_rotary_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/rotary-audit
      - name: Compile and inspect standalone V3 Muff (not firmware integrated)
        run: python3 parable-starter/tools/check_muff_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/muff-audit
      - name: Compile and inspect standalone TS808 (not firmware integrated)
        run: python3 parable-starter/tools/check_ts808_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/ts808-audit
      - name: Compile and inspect standalone S698 Klon contact model (not firmware integrated)
        run: python3 parable-starter/tools/check_klon_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/klon-audit
      - name: Compile and inspect standalone Lockhart cell (not firmware integrated)
        run: python3 parable-starter/tools/check_wavefolder_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/wavefolder-audit
      - name: Compile and inspect standalone Scorpio transistor and magnetic drive
        run: python3 parable-starter/tools/check_scorpio_arm.py --compiler parable-starter/build/arm-cache/xpack-arm-none-eabi-gcc-14.2.1-1.1/bin/arm-none-eabi-g++ --output parable-starter/build/arm/scorpio-audit
      - name: Publish first-boot kit candidate (never flash here)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed3-first-boot-kit
          path: parable-starter/build/arm/first-boot/
          if-no-files-found: error
          retention-days: 30
      - name: Retain ARM binaries, maps, logs and notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seed3-arm-build-evidence
          path: parable-starter/build/arm/
          if-no-files-found: error
          retention-days: 7
