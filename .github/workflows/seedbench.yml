name: Seed3 live drive bench
on:
  push:
    branches: [bench/seed3-live-drives]
  pull_request:
    paths: ['parable-starter/tools/resources/seedbench/**']
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 parable-starter/tools/resources/seedbench/build_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Seed3_Live_Drives
          path: parable-starter/build/caploc-kit/
          if-no-files-found: error
